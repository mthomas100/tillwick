<!doctype html>
<!--
  renderer/phaser/index.dev.html — STANDALONE validation harness for the Wave-3 Phaser engine.
  Lets me prove the engine draws + moves WITHOUT editing the hot file renderer/index.html (lead owns that).
  It mirrors exactly what the index.html hook will do (see the HOOKS SPEC in my report): load phaser.min.js,
  then the ESM entry town-renderer.js, with the same #left/#hud/#feed DOM the real page has.
  Serve from the sim (it static-serves renderer/) and open:  http://localhost:4042/phaser/index.dev.html
  Add ?art=placeholder|limezu|ninja to switch art packs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tillwick — Phaser (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0a; color: #fafaf5;
        font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
      #app { display: flex; height: 100vh; }
      #left { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; position: relative; }
      #hud { position: absolute; top: 12px; left: 14px; font-size: 13px; line-height: 1.6; z-index: 5;
        background: rgba(0,0,0,.55); padding: 8px 12px; border: 1px solid #1a1a1a; border-radius: 8px; }
      #hud b { color: #ff9100; } .live { color: #6ee7b7; } .dim { color: #6b6b66; }
      #feed { width: 380px; flex: none; border-left: 1px solid #1a1a1a; background: #0d0d0c;
        display: flex; flex-direction: column; height: 100vh; }
      #feed h2 { margin: 0; padding: 12px 14px; font-size: 12px; color: #ff9100; letter-spacing: .08em; border-bottom: 1px solid #1a1a1a; }
      #chips { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #1a1a1a; flex-wrap: wrap; }
      .chip { font-size: 11px; padding: 3px 9px; border: 1px solid #2a2a2a; border-radius: 999px; color: #9a9a93; cursor: pointer; user-select: none; }
      .chip.on { color: #0b0b0a; background: #6ee7b7; border-color: #6ee7b7; }
      #rows { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
      .row { font-size: 12px; line-height: 1.45; padding: 6px 8px; border-left: 3px solid #333; background: #111110; border-radius: 4px; word-break: break-word; }
      .row .who { font-weight: 600; } .row a { color: #00d4ff; text-decoration: none; }
      .row.pay { background: #0f140f; } .row.think { opacity: .72; } .row.move { opacity: .42; font-size: 11px; }
      .amt { color: #6ee7b7; font-weight: 600; }
      #tally { padding: 8px 12px; border-top: 1px solid #1a1a1a; font-size: 11px; color: #9a9a93; max-height: 170px; overflow-y: auto; }
      .bar { height: 6px; border-radius: 3px; margin: 2px 0 6px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left"><div id="hud">…connecting…</div></div>
      <aside id="feed">
        <h2>◷ ACTIVITY</h2>
        <div id="chips">
          <span class="chip" data-f="all">all</span>
          <span class="chip on" data-f="pay">payments</span>
          <span class="chip on" data-f="talk">talk</span>
          <span class="chip on" data-f="think">decisions</span>
          <span class="chip" data-f="move">moves</span>
        </div>
        <div id="rows"></div>
        <div id="tally"></div>
      </aside>
    </div>
    <!-- 1) Phaser global, vendored locally (no CDN at runtime) -->
    <script src="./vendor/phaser.min.js"></script>
    <!-- 2) the ESM entry point (mirrors the index.html hook) -->
    <script type="module" src="./town-renderer.js"></script>
    <!-- the real page ALSO loads tx-overlay.js / inspector.js / control.js here; omitted in this harness so we
         validate the ENGINE in isolation. They're proven to coexist via the published __town* globals + id="c". -->
  </body>
</html>
